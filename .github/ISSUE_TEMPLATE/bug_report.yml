name: Bug report
description: Accord crashed, read a file wrong, or reported something that is not true.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output (`ACCORD_DEBUG=1` adds the stack trace).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Code (CSS, Tailwind, components)
        - Figma (.fig)
        - Figma export (JSON)
        - Pencil (.pen)
        - Claude Design
        - Token files (DTCG, Tokens Studio)
        - MCP server or GitHub Action
        - Other
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: A file that shows it
      description: The smallest file or repository that reproduces it. Remove anything confidential first.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`accord --version`, Node.js version, operating system"
