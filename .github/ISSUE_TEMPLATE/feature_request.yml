name: Idea
description: A surface, format, rule or workflow Accord should support.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What your team does today and where it hurts.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: The register stays the truth; surfaces propose, they do not sync directly.
          required: true
